[project]
name = "funmd"
version = "0.1.3"
description = "Markdown 表格与 pandas DataFrame 互转的小工具，提供 to_pandas / from_pandas 两个函数，兼容 | 和 + 两种表格分隔风格"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = [ "pandas>=2.0", "tabulate>=0.9",]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "pytest>=9.0.3",]
