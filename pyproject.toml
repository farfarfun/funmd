[project]
name = "funmd"
version = "0.1.3"
description = "Markdown 表格与 pandas DataFrame 互转的小工具，提供 to_pandas / from_pandas 两个函数，兼容 | 和 + 两种表格分隔风格"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [ "pandas>=2.0", "tabulate>=0.9",]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funmd"
Releases = "https://github.com/farfarfun/funmd/releases"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "pytest>=9.0.3", "ruff>=0.9",]

[tool.ruff]
target-version = "py310"
